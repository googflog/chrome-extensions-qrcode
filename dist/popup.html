<!DOCTYPE html>
<html>
  <head>
    <title>Quick Get QR & Short URL</title>
    <link rel="stylesheet" href="css/perfect-scrollbar.css"/>
    <link rel="stylesheet" href="css/demo.css"/>
    <link rel="stylesheet" href="css/pop.css"/>
  </head>
  <body>
    <h1 class="app_ttl">Quick Get QR & Short URL<span class="version">ver.</span></h1>
    <div class="contets">
      <div class="contets_scroll">
        <div class="contets_inline">
          <div class="qr">
            <div class="qr_wrap">
              <div id="qr"></div><a class="download button" href="#" download="#" title="Download"><svg x="0px" y="0px" viewBox="0 0 24 24" style="enable-background:new 0 0 24 24;" xml:space="preserve">
<style type="text/css">.st0{stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}</style>
<path class="st0" d="M21,15v4c0,1.1-0.9,2-2,2H5c-1.1,0-2-0.9-2-2v-4"/>
<polyline class="st0" points="7,10 12,15 17,10 "/>
<line class="st0" x1="12" y1="15" x2="12" y2="3"/>
</svg></a>
            </div>
            <div class="alert"></div>
            <div class="textarea">
              <textarea class="url" name="url"></textarea>
            </div>
            <div class="ctrl">
              <button class="history" title="History"><svg x="0px" y="0px" viewBox="0 0 24 24" style="enable-background:new 0 0 24 24;" xml:space="preserve">
<style type="text/css">.st0{stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}</style>
<line class="st0" x1="12" y1="12" x2="12" y2="6.9"/>
<circle class="st0" cx="12" cy="12" r="9.3"/>
<line class="st0" x1="10" y1="14.4" x2="12" y2="12"/>
</svg>
              </button>
            </div>
          </div>
          <div class="history_block">
            <div class="history-list">
              <div>
                <ul></ul>
              </div>
            </div>
            <div class="ctrl">
              <button class="back" title="Back"><svg x="0px" y="0px" viewBox="0 0 24 24" style="enable-background:new 0 0 24 24;" xml:space="preserve">
                <style>.st0{fill:none;stroke:#000000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}</style><path class="st0" d="M3.6,11.9h16.8"/>
<polyline class="st0" points="11.3,4.2 3.6,11.9 11.3,19.8 "/>
</svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="lib/jquery.min.js"></script>
    <script src="lib/jquery.qrcode.min.js"></script>
    <script src="lib/perfect-scrollbar.min.js"></script>
    <script src="lib/encoding.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
